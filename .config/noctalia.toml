[bar.default]
background_opacity = 0.87999998033046722
concave_edge_corners = false
end = [
    "media",
    "status",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
margin_ends = 0
radius = 0
widget_spacing = 12

[dock]
concave_edge_corners = false
enabled = true
icon_size = 32
launcher_icon = "rocket"
launcher_position = "start"
magnification_scale = 1.2500000037252903
main_axis_padding = 8
pinned = [ "emacs", "Alacritty", "firefox", "org.gnome.Nautilus" ]
radius = 2
reserve_space = false
show_dots = true
smart_auto_hide = true

[hot_corners]
enabled = true

    [hot_corners.bottom_left]
    action = "command"
    command = "noctalia msg workspace-switch prev"

    [hot_corners.bottom_right]
    action = "command"
    command = "noctalia msg workspace-switch next"

[location]
address = "Hamburg, Germany"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3", "lockscreen-login-box@DP-2", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 720.0
    cx = 1720.0
    cy = 1321.0
    output = "DP-2"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 720.0
    cx = 1720.0
    cy = 1321.0
    output = "DP-3"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 360.0
    cy = 420.5
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "davemhammer/tailscale" ]

[shell]
corner_radius_scale = 0.5000000074505806
panel_anchor_bar = "default"
settings_show_advanced = false

    [shell.launcher]
    categories = false
    compact = true

    [shell.panel]
    launcher_placement = "attached"

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "emacs", "gtk3", "gtk4", "hyprland", "qt" ]
    community_ids = [
        "brave",
        "pywalfox",
        "pywalfox-beta4",
        "zen-browser",
        "discord",
        "gimp",
        "libreoffice",
        "steam",
        "hyprtoolkit",
        "papirus-icons",
        "bat",
        "fzf"
    ]

[wallpaper]
directory = "/home/torben/wallpaper"

    [wallpaper.default]
    path = "/home/torben/wallpaper/sekiro.jpg"

    [wallpaper.last]
    path = "/home/torben/wallpaper/sekiro.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/torben/wallpaper/sekiro.jpg"

[widget.network]
show_label = false
show_vpn_label = true

[widget.status]
type = "davemhammer/tailscale:status"
